name: Build and Analyze

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Build and Analyze
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover Xcode project and scheme
        id: discover
        run: |
          # Find the .xcodeproj file
          PROJECT_FILE=$(ls -1 *.xcodeproj 2>/dev/null | head -1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ No .xcodeproj found"
            exit 1
          fi
          echo "Found project: $PROJECT_FILE"

          # Extract the first target/scheme from xcodebuild
          SCHEME=$(xcodebuild -project "$PROJECT_FILE" -list -json 2>/dev/null \
            | ruby -e "require 'json'; d=JSON.parse(STDIN.read); puts (d['project']['schemes']&.first || d['project']['targets']&.first)")
          if [ -z "$SCHEME" ]; then
            echo "❌ No scheme found"
            exit 1
          fi
          echo "Using scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT_FILE" >> "$GITHUB_OUTPUT"

      - name: Build and Analyze
        run: |
          SCHEME="${{ steps.discover.outputs.scheme }}"
          PROJECT="${{ steps.discover.outputs.project }}"
          echo "Building scheme: $SCHEME in project: $PROJECT"
          xcodebuild clean build analyze \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
