name: Build and Analyze

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Build and Analyze
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover Xcode project and scheme
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find . -type d -name "*.xcodeproj" -print 2>/dev/null | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ No .xcodeproj found"
            exit 1
          fi
          echo "Found project: $PROJECT_FILE"

          LIST_OUTPUT="$(xcodebuild -project "$PROJECT_FILE" -list -json 2>/dev/null || true)"
          if [ -z "$LIST_OUTPUT" ] || [ "$LIST_OUTPUT" = "null" ]; then
            echo "❌ xcodebuild did not return valid project metadata"
            xcodebuild -project "$PROJECT_FILE" -list || true
            exit 1
          fi

          SCHEME="$(ruby -e 'require "json"; data = JSON.parse(STDIN.read); puts((data.dig("project", "schemes")&.first || data.dig("project", "targets")&.first))' <<< "$LIST_OUTPUT")"

          if [ -z "$SCHEME" ]; then
            echo "❌ No scheme found"
            echo "$LIST_OUTPUT"
            exit 1
          fi

          echo "Using scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT_FILE" >> "$GITHUB_OUTPUT"

      - name: Build and Analyze
        run: |
          SCHEME="${{ steps.discover.outputs.scheme }}"
          PROJECT="${{ steps.discover.outputs.project }}"
          echo "Building scheme: $SCHEME in project: $PROJECT"
          xcodebuild clean build analyze \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO